name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri / Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Release derlemesi (imzasız) / Release build (unsigned)
        run: ./gradlew -ParmUniversal :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-raporlari
          path: app/build/reports/tests/
